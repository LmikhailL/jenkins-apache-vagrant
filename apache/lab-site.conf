# Apache virtual host deployed by Jenkins.
# Includes a few endpoints that intentionally fail so that 4xx/5xx
# entries appear in the logs for the log-analysis stage.
<VirtualHost *:80>
    ServerName apache-vm
    DocumentRoot /var/www/lab

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /var/www/lab>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # 403 Forbidden
    <Location /private>
        Require all denied
    </Location>

    # 500 Internal Server Error: a CGI script that emits no headers
    ScriptAlias /cgi-bin/ /var/www/lab-cgi/
    <Directory /var/www/lab-cgi>
        Options +ExecCGI
        Require all granted
    </Directory>

    # 503 Service Unavailable / 410 Gone via mod_rewrite
    RewriteEngine On
    RewriteRule ^/maintenance$ - [R=503,L]
    RewriteRule ^/old-page$    - [G]
</VirtualHost>
